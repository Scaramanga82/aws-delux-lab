name: Terraform Apply

on:
  workflow_dispatch:

env:
  TF_ROOT: terraform
  PLAN_BUCKET: delux-terraform-plan

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout repo at current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Detect ENVIRONMENT based on branch
        run: |
          if [ "${{ github.ref_name }}" == "dev" ]; then ENVIRONMENT="dev";
          elif [ "${{ github.ref_name }}" == "stage" ]; then ENVIRONMENT="stage";
          elif [ "${{ github.ref_name }}" == "prod" ]; then ENVIRONMENT="prod";
          else echo "Unsupported branch"; exit 1; fi

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "STACK_DIR=terraform/stacks/$ENVIRONMENT" >> $GITHUB_ENV
          echo "TF_VAR_FILE=env-config/$ENVIRONMENT.tfvars" >> $GITHUB_ENV
          echo "Applying environment: $ENVIRONMENT"

      - name: Terraform Init
        working-directory: ${{ env.STACK_DIR }}
        run: |
          terraform init \
            -backend-config="../../env-config/${ENVIRONMENT}.backend"

      - name: Download Terraform Plan from S3
        run: |
          aws s3 cp \
            s3://${{ env.PLAN_BUCKET }}/${ENVIRONMENT}/plan-${ENVIRONMENT}.tfplan \
            ${{ env.STACK_DIR }}/plan-${ENVIRONMENT}.tfplan

      - name: Terraform Apply
        working-directory: ${{ env.STACK_DIR }}
        run: |
          terraform apply plan-${ENVIRONMENT}.tfplan
