name: Deploy Frontend to S3 + CloudFront

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '18'
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Build & Deploy Frontend (dev)
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------
      # Checkout
      # ---------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------
      # Node setup
      # ---------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ---------------------------------------
      # Install deps
      # ---------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------
      # Build
      # ---------------------------------------
      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_AWS_REGION: ${{ env.AWS_REGION }}

      # ---------------------------------------
      # Create release metadata
      # ---------------------------------------
      - name: Create release metadata
        run: |
          cat <<EOF > dist/release.json
          {
            "commit": "${GITHUB_SHA::7}",
            "branch": "${GITHUB_REF_NAME}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "environment": "${{ env.ENVIRONMENT }}"
          }
          EOF

      # ---------------------------------------
      # AWS auth
      # ---------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------------------------------------
      # Save release FIRST (immutable)
      # ---------------------------------------
      - name: Save release artifacts
        run: |
          RELEASE_VERSION=${GITHUB_SHA::7}

          aws s3 sync dist/ s3://${{ secrets.RELEASES_BUCKET }}/$RELEASE_VERSION/ \
            --cache-control "public,max-age=31536000,immutable"

      # ---------------------------------------
      # Fail-fast verification
      # ---------------------------------------
      - name: Verify release exists (fail-fast)
        run: |
          RELEASE_VERSION=${GITHUB_SHA::7}
          aws s3 ls s3://${{ secrets.RELEASES_BUCKET }}/$RELEASE_VERSION/index.html

      # ---------------------------------------
      # Deploy to S3 (dev bucket)
      # ---------------------------------------
      - name: Sync assets to S3 (immutable)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude "index.html" \
            --exclude "*.map" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # ---------------------------------------
      # CloudFront invalidation
      # ---------------------------------------
      - name: Invalidate CloudFront (index.html only)
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" \
            --query 'Invalidation.Id' \
            --output text)

          echo "CloudFront invalidation created: $INVALIDATION_ID"
